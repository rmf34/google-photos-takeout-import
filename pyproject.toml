[project]
name = "google-photos-takeout-import"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["timezonefinder"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E402: module-level import not at top — unavoidable after sys.path.insert() in tests
# E501: line too long — handled by formatter, not enforced in lint
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
# Test imports after sys.path manipulation are expected
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
